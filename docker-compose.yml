services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seasonly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seasonly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-seasonly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seasonly} -d ${POSTGRES_DB:-seasonly}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
