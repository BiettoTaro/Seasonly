services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8001}:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seasonly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seasonly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-seasonly}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seasonly} -d ${POSTGRES_DB:-seasonly}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
