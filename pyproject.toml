[project]
name = "seasonly"
version = "0.1.0"
description = "FastAPI backend for the Seasonly iOS app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=2.0,<3.0",
    "pydantic-settings>=2.6.0",
    "scikit-learn>=1.7,<2.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "httpx2>=2.5.0",
    "playwright>=1.52.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
ml = [
    "lightgbm>=4.6,<5.0",
]
notebook = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "pandas>=2.3,<4",
    "pandas-stubs>=3.0.5.260730",
    "seaborn>=0.13,<1",
    "types-seaborn>=0.13.2.20260728",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.pyrefly]
search-path = ["backend"]
